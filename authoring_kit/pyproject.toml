[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontowiz-authoring-kit"
version = "0.1.0"
description = "Independent candidate-only OntoWiz authoring and evaluation kit"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "jsonschema>=4.22",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
owak = "ontowiz_authoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: schema and lifecycle contract tests",
    "adversarial: malicious or malformed input tests",
    "integration: multi-component tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/ontowiz_spec/pinned_v0_1/*"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80.77
omit = ["src/ontowiz_spec/pinned_v0_1/*"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ontowiz_spec", "ontowiz_authoring", "ontowiz_evaluator"]

[[tool.mypy.overrides]]
module = ["ontowiz_spec.pinned_v0_1", "ontowiz_spec.pinned_v0_1.*"]
follow_imports = "skip"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/ontowiz_spec/pinned_v0_1"]

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "SIM", "UP", "W"]

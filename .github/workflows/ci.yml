name: Onto_Wiz CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-audit:
    name: Verify-Audit (monorepo gate — ADR-015)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install src + dev tooling
        run: pip install -e ".[dev]"

      - name: Install monorepo packages (editable)
        run: |
          pip install -e packages/ontowiz-spec --no-deps
          pip install -e packages/ontowiz-ctx --no-deps
          pip install -e packages/ontowiz-runtime --no-deps
          pip install -e packages/ontowiz-core --no-deps
          pip install -e packages/ontowiz-factory --no-deps
          pip install -e packages/ontowiz-serve --no-deps

      - name: verify-audit.sh (6 owned gates)
        # package tests+coverage >=85% | ruff | mypy (Tier A) | A->B boundary |
        # Cathedral Keeper new-code clean | legacy src suite green
        run: bash scripts/verify-audit.sh

  python-checks:
    name: Python Lint + Type Check + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Tests + Coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Quality Gate
        run: python quality-gate/quality_gate.py --root .

      - name: Slop Checker
        # Non-blocking until baseline violations are cleaned up (SEN-002)
        # Pre-commit hook still blocks new slop on staged files
        continue-on-error: true
        run: python quality/slop_checker.py --config quality/config.yaml --root .

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {

}

  border-color: var(--primary);

}

.btn:focus-visible {

}

svg {

  &lt;/section&gt;

  &lt;section class=&quot;ow-view&quot; id=&quot;ow-view-storage&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ow-tab-storage&quot; data-panel=&quot;storage&quot; hidden&gt;
    &lt;div class=&quot;ow-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Storage placement by responsibility&lt;/h2&gt;&lt;p class=&quot;ow-muted&quot;&gt;There is no universal knowledge database. Each state has one authority and projections remain disposable.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ow-legend&quot; aria-label=&quot;Storage classification legend&quot;&gt;&lt;span&gt;&lt;span class=&quot;ow-type-key&quot; data-kind=&quot;external&quot;&gt;&lt;/span&gt; External authority&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;ow-type-key&quot;&gt;&lt;/span&gt; Canonical&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;ow-type-key&quot; data-kind=&quot;operational&quot;&gt;&lt;/span&gt; Operational&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;ow-type-key&quot; data-kind=&quot;derived&quot;&gt;&lt;/span&gt; Derived&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;ow-type-key&quot; data-kind=&quot;target&quot;&gt;&lt;/span&gt; Target&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;viz-controls&quot; role=&quot;group&quot; aria-label=&quot;Filter storage systems&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot; data-store-filter=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-store-filter=&quot;external&quot;&gt;External&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-store-filter=&quot;canonical&quot;&gt;Canonical&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-store-filter=&quot;operational&quot;&gt;Operational&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-store-filter=&quot;derived&quot;&gt;Derived&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ow-storage-list&quot; aria-label=&quot;Storage responsibility matrix&quot;&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;external&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Client source systems&lt;/h3&gt;&lt;span class=&quot;viz-badge&quot;&gt;SYSTEM OF RECORD&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Physical system&lt;/dt&gt;&lt;dd&gt;Veeva, DMS, SharePoint, CRM, consent system, Snowflake or Databricks data products.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Raw documents, transcripts, fact rows, patient/customer events, inventory and cost facts.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Boundary&lt;/dt&gt;&lt;dd&gt;Onto_Wiz stores governed locators and contracts, not a duplicate bulk corpus or warehouse.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;canonical&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Approved PackSource&lt;/h3&gt;&lt;span class=&quot;viz-badge&quot;&gt;CANONICAL SEMANTIC SOURCE&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Pilot backing&lt;/dt&gt;&lt;dd&gt;Private Git at immutable SHA. Later backing may be governance DB plus object-store materialization behind the same PackSource contract.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Ontology, terminology, claims, policies, metric/table/join contracts, source identities, controlled spans, agent contracts and eval definitions.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Must not contain&lt;/dt&gt;&lt;dd&gt;Raw client corpora, patient rows, secrets, unapproved model output, or floating &lt;code&gt;latest&lt;/code&gt; dependencies.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;operational&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Governance database&lt;/h3&gt;&lt;span class=&quot;viz-badge&quot;&gt;WORKFLOW &amp;amp; AUDIT&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Physical system&lt;/dt&gt;&lt;dd&gt;SQLite in development; tenant-isolated PostgreSQL in production.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Deltas, revisions, dissent, decisions, ACLs, jobs/outbox, intake candidates, run metadata, corrections and immutable audit receipts.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Boundary&lt;/dt&gt;&lt;dd&gt;Operational truth is not released knowledge. An approved Delta materializes one controlled pack revision.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;canonical&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Artifact registry&lt;/h3&gt;&lt;span class=&quot;viz-badge&quot;&gt;IMMUTABLE RELEASE&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Physical system&lt;/dt&gt;&lt;dd&gt;Content-addressed object storage now; OCI-shaped registry contract as the portable target.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Resolved manifest, exact compiled inventory, candidate bytes, validation report, EvalReceipt and ReleaseAttestation bound by digest.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Runtime rule&lt;/dt&gt;&lt;dd&gt;Load by attested digest and exact inventory. Never glob a filesystem or execute a Git checkout.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;external&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Governed data products&lt;/h3&gt;&lt;span class=&quot;viz-badge&quot;&gt;NUMBER EXECUTION&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Physical system&lt;/dt&gt;&lt;dd&gt;Warehouse/lakehouse facts, dimensions, governed views and approved query execution.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Actual numbers, row-level controls, snapshots, freshness, restatements and governed aggregates.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Context-layer role&lt;/dt&gt;&lt;dd&gt;Pack stores formula, grain, denominator, dimensions, declared joins, DQ, suppression and interpretation limits; typed tools return aggregate QueryReceipts.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;derived&quot; data-projection=&quot;true&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;OpenSearch hybrid index&lt;/h3&gt;&lt;span class=&quot;viz-badge ow-rebuild-state&quot;&gt;DERIVED · READY&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Indexed metadata&lt;/dt&gt;&lt;dd&gt;Tenant, release digest, artifact ID/kind/version, scope, validity, access class, source-span refs, authority, lexical text and embedding model/config/version.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Retrieval rule&lt;/dt&gt;&lt;dd&gt;Filter tenant, access, market, audience, purpose, channel and time before lexical/vector ranking.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Never owns&lt;/dt&gt;&lt;dd&gt;Approval truth, raw warehouse rows, unrestricted evidence, model secrets, held-out answers, or correctness by similarity.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;derived&quot; data-projection=&quot;true&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Graph and catalog read model&lt;/h3&gt;&lt;span class=&quot;viz-badge ow-rebuild-state&quot;&gt;DERIVED · READY&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Physical system&lt;/dt&gt;&lt;dd&gt;Compiled adjacency/read models or PostgreSQL first; a graph vendor only after measured traversal need.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Rebuildable lineage, typed relationships, dependency neighborhoods, blast radius and table/column catalog views.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Never owns&lt;/dt&gt;&lt;dd&gt;Canonical ontology, review decision, evidence authority, release gate, or source bytes.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;derived&quot; data-projection=&quot;true&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Release-scoped runtime cache&lt;/h3&gt;&lt;span class=&quot;viz-badge ow-rebuild-state&quot;&gt;DERIVED · READY&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Key&lt;/dt&gt;&lt;dd&gt;Tenant + release digest + operation + normalized scope + access capability.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Nothing canonical. It accelerates already-authorized deterministic resolution.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Invalidation&lt;/dt&gt;&lt;dd&gt;Purge or epoch on withdrawal, access change, expiry, source deletion or new release. Cache never authorizes.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;operational&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Observability store&lt;/h3&gt;&lt;span class=&quot;viz-badge&quot;&gt;REDACTED TELEMETRY&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;Correlation IDs, safe decision classes, artifact references, latency, failures, abstentions, cost and recurrence.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Must not contain&lt;/dt&gt;&lt;dd&gt;Raw prompts, raw source text, PHI, customer identities, secrets or reusable client content by default.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Use&lt;/dt&gt;&lt;dd&gt;Feedback proposes a Delta and regression case; it never edits a release.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
      &lt;article class=&quot;ow-store&quot; data-store-kind=&quot;operational&quot;&gt;&lt;div class=&quot;ow-store-name&quot;&gt;&lt;h3&gt;Local filesystem&lt;/h3&gt;&lt;span class=&quot;viz-badge&quot;&gt;DEV / CACHE ONLY&lt;/span&gt;&lt;/div&gt;&lt;dl&gt;&lt;dt&gt;Allowed&lt;/dt&gt;&lt;dd&gt;Authoring checkout, local fixture, isolated build workspace and development backing behind interfaces.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Forbidden&lt;/dt&gt;&lt;dd&gt;Production discovery, glob-based loading, release authority, client corpus dumping or public storage contract.&lt;/dd&gt;&lt;/dl&gt;&lt;dl&gt;&lt;dt&gt;Scale rule&lt;/dt&gt;&lt;dd&gt;Compiler receives PackSource and ArtifactRegistry contracts, never a privileged filesystem path.&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ow-projection-demo&quot; aria-live=&quot;polite&quot;&gt;&lt;div&gt;&lt;strong id=&quot;ow-projection-title&quot;&gt;Projection exercise: all derived stores are ready&lt;/strong&gt;&lt;p class=&quot;ow-muted&quot; id=&quot;ow-projection-copy&quot;&gt;The signed release and canonical inventory remain unchanged if every retrieval projection is deleted.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;ow-projection-action&quot;&gt;Simulate projection purge&lt;/button&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;ow-view&quot; id=&quot;ow-view-agent&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ow-tab-agent&quot; data-panel=&quot;agent&quot; hidden&gt;
    &lt;div class=&quot;ow-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Run one typed agent request&lt;/h2&gt;&lt;p class=&quot;ow-muted&quot;&gt;The agent calls one REST/MCP gateway. Storage selection, access, scope, evidence and release verification stay behind the contract.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot;&gt;NO DIRECT SQL · VECTOR · GRAPH&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;ow-agent-layout&quot;&gt;
      &lt;div class=&quot;ow-agent-controls&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;ow-workload&quot;&gt;Agent workload&lt;select class=&quot;form-select&quot; id=&quot;ow-workload&quot;&gt;&lt;option value=&quot;content&quot;&gt;Marketing content&lt;/option&gt;&lt;option value=&quot;mlr&quot;&gt;MLR preflight&lt;/option&gt;&lt;option value=&quot;analytics&quot;&gt;Brand analytics&lt;/option&gt;&lt;option value=&quot;omnichannel&quot;&gt;Omnichannel next action&lt;/option&gt;&lt;option value=&quot;access&quot;&gt;Value &amp;amp; access&lt;/option&gt;&lt;option value=&quot;patient&quot;&gt;Patient services&lt;/option&gt;&lt;option value=&quot;supply&quot;&gt;Supply chain / COGS&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;ow-failure&quot;&gt;Failure injection&lt;select class=&quot;form-select&quot; id=&quot;ow-failure&quot;&gt;&lt;/select&gt;&lt;/label&gt;
        &lt;label class=&quot;form-check form-switch&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;ow-candidate-mode&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Use diagnostic candidate&lt;/span&gt;&lt;/label&gt;
        &lt;div class=&quot;ow-question&quot;&gt;&lt;strong&gt;Typed request&lt;/strong&gt;&lt;p id=&quot;ow-operation&quot;&gt;&lt;code&gt;get_content_brief&lt;/code&gt;&lt;/p&gt;&lt;p id=&quot;ow-question&quot;&gt;Draft a US HCP email about fictional Auravia EASI-75 response.&lt;/p&gt;&lt;p class=&quot;ow-muted&quot; id=&quot;ow-scope&quot;&gt;Tenant: auravia-demo · US · HCP · promotional evaluation · released 0.1.1-demo&lt;/p&gt;&lt;/div&gt;
        &lt;button class=&quot;btn btn-primary btn-block&quot; type=&quot;button&quot; id=&quot;ow-run&quot;&gt;Run typed request&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;ow-trace&quot; aria-label=&quot;Agent serving execution trace&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;1&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Authenticate and pin release&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Server derives tenant, capabilities and eligible release.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;Auth + registry&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;2&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Resolve scope&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Market, audience, purpose, channel, product and time become explicit.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;Compiled scope&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;3&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Route through ontology&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Intent becomes stable concepts, operations and retrieval keys.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;Release graph&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;4&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Load correctness bundle&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Exact rules, claims, risk, metric and policy contracts load deterministically.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;Artifact registry&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;5&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Prefilter metadata&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Tenant, access, applicability and validity filter before similarity.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;OpenSearch&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;6&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Rank supporting context&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Lexical, vector and relationship signals select relevant detail.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;Search + graph&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;7&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Execute governed data tool&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot; id=&quot;ow-data-tool-detail&quot;&gt;Not required for this content request.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot; id=&quot;ow-data-tool-store&quot;&gt;Not touched&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;8&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Apply quality and policy gate&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Critical missing, stale, unsafe or wrong-scope context blocks or abstains.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;Compiled policy&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;9&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Assemble minimal context&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Required safety is retained; only task-relevant detail enters the context budget.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;Context gateway&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ow-trace-step&quot; data-trace-step=&quot;10&quot;&gt;&lt;span class=&quot;ow-trace-number&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;ow-trace-title&quot;&gt;Return trust receipt&lt;/span&gt;&lt;span class=&quot;ow-trace-detail&quot;&gt;Decision, artifacts, evidence, policy, release, validity and human authority.&lt;/span&gt;&lt;span class=&quot;ow-trace-store&quot;&gt;REST / MCP&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ow-response-grid&quot;&gt;
      &lt;div class=&quot;ow-response&quot; id=&quot;ow-response&quot; aria-live=&quot;polite&quot;&gt;&lt;span class=&quot;ow-response-label&quot; id=&quot;ow-response-label&quot;&gt;READY · released context&lt;/span&gt;&lt;p id=&quot;ow-response-summary&quot;&gt;Run the request to produce a simulated governed response and trace.&lt;/p&gt;&lt;pre&gt;&lt;code id=&quot;ow-receipt&quot;&gt;{
  &quot;decision&quot;: &quot;NOT_RUN&quot;,
  &quot;production_eligible&quot;: false
}&lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;
      &lt;div class=&quot;ow-compare&quot; aria-label=&quot;Governed and ungoverned response comparison&quot;&gt;&lt;div&gt;&lt;strong&gt;With released context&lt;/strong&gt;&lt;p id=&quot;ow-with-context&quot;&gt;Scoped artifacts, exact evidence, policy gate, release digest and receipt.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Without context&lt;/strong&gt;&lt;p id=&quot;ow-without-context&quot;&gt;Plausible prose without governed scope, evidence, policy or reproducible numeric meaning.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;ow-view&quot; id=&quot;ow-view-scale&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ow-tab-scale&quot; data-panel=&quot;scale&quot; hidden&gt;
    &lt;div class=&quot;ow-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Scale by composition, not by cloning the platform&lt;/h2&gt;&lt;p class=&quot;ow-muted&quot;&gt;New domains register artifact profiles, relationships, validators, projections, typed operations and eval adapters. The engine and lifecycle stay unchanged.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot;&gt;SECOND-CONSUMER GATE&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;ow-scale-layout&quot;&gt;
      &lt;div class=&quot;ow-layer-stack&quot; aria-label=&quot;Pack composition stack&quot;&gt;&lt;div class=&quot;ow-layer&quot;&gt;&lt;h3&gt;Generic semantic kernel&lt;/h3&gt;&lt;p&gt;Identity, evidence, scope, version, lifecycle, trust receipt.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ow-layer&quot;&gt;&lt;h3&gt;Pharma commercial base&lt;/h3&gt;&lt;p&gt;Product, market, stakeholder, policy, interaction, metric, dataset.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ow-layer&quot;&gt;&lt;h3&gt;Function module&lt;/h3&gt;&lt;p id=&quot;ow-layer-function&quot;&gt;Marketing &amp;amp; MLR contracts.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ow-layer&quot;&gt;&lt;h3&gt;Market / regulatory policy&lt;/h3&gt;&lt;p&gt;US, GB or client-approved jurisdictional constraints.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ow-layer&quot;&gt;&lt;h3&gt;Therapy / product / program&lt;/h3&gt;&lt;p&gt;Reusable domain definitions and evidence applicability.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ow-layer&quot;&gt;&lt;h3&gt;Private client overlay&lt;/h3&gt;&lt;p&gt;Mappings, operating rules, policies and data-product contracts.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ow-layer&quot;&gt;&lt;h3&gt;Workload release&lt;/h3&gt;&lt;p&gt;Thin, pinned composition for one named agent decision.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

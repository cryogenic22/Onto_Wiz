[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontowiz-factory"
version = "0.1.0"
description = "Onto_Wiz factory — the secret sauce (Tier B — INTERNAL ONLY, never ships). Mining, Forge, steward loops, evals, pack compiler."
requires-python = ">=3.10"
dependencies = [
    "ontowiz-spec",
    "ontowiz-core",
    "ontowiz-ctx[packer]",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Extraction / LLM extras land at F4 when mining is ported.
llm = ["litellm>=1.0"]

[tool.setuptools.packages.find]
include = ["ontowiz_factory*"]

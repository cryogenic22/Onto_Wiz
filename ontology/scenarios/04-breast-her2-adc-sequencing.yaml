id: "onc-breast-her2-adc-sequencing"
name: "HER2+ Breast Cancer ADC Sequencing Disruption"
description: >
  T-DXd (trastuzumab deruxtecan) reshapes the HER2+ breast cancer 2L treatment
  sequence at a comprehensive breast center. Tumor board updates protocol based
  on DESTINY-Breast03 OS data, displacing prior standard TDM1 sequencing.
  Rapid adoption creates competitive displacement for established HER2 regimens.


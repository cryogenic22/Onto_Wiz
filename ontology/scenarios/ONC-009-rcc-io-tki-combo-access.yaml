id: "ONC-009"
name: "RCC IO+TKI Combination — Payer Step-Edit Barrier"
description: >
  Multiple IO+TKI combinations approved for RCC 1L (pembrolizumab+lenvatinib,
  nivolumab+cabozantinib). Payer imposes step-edit requiring single-agent IO
  failure before combination approval. Patients receive suboptimal monotherapy,
  and some progress before combination access is granted. Brand (IO+TKI combo)
  faces systematic access barrier at key payer.

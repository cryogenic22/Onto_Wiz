id: "onc-nsclc-alk-competitive-entry"
name: "NSCLC ALK+ Lorlatinib Competitive Displacement"
description: >
  ALK-rearranged NSCLC market disrupted by lorlatinib gaining 1L positioning
  after CROWN trial data. Academic centers rapidly update protocols, shifting
  away from alectinib-based sequences. OncoVance loses share in ALK+ segment
  at institutions with strong tumor board governance.

therapeutic_area: "oncology"
indication: "NSCLC"
molecular_subtype: "ALK-rearranged"
line_of_therapy: "1L"

brand_context:
  brand: "OncoVance"
  lifecycle: "growth"
  asset_class: "biologic"
  biomarkers_required: ["ALK rearrangement (FISH or IHC)"]

account_context:
  type: "academic_center"

id: "ONC-007"
name: "DLBCL CAR-T vs Bispecific Antibody Sequencing Disruption"
description: >
  CAR-T (axi-cel, liso-cel) established as 2L R/R DLBCL standard for
  transplant-eligible patients. Bispecific antibodies (glofitamab, epcoritamab)
  now entering 2L+ as off-the-shelf alternatives. CAR-T referral patterns shift
  as community oncologists adopt bispecifics to avoid CAR-T manufacturing delays
  and toxicity management complexity.
